<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fa;
      color: #273444;
      font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
    }

    .app-header {
      min-height: 70px;
      background: #2857a4;
      color: #fff;
      box-shadow: 0 2px 8px rgba(17, 44, 83, 0.2);
    }

    .header-inner {
      width: min(100% - 40px, 1380px);
      min-height: 70px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    h1 {
      margin: 0;
      color: #fff;
      font-size: 23px;
      font-weight: 700;
    }

    .app-title {
      color: inherit;
      text-decoration: none;
    }

    .menu-toggle {
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 27px;
      line-height: 1;
      cursor: pointer;
    }

    .site-nav {
      display: none;
      position: absolute;
      z-index: 1000;
      top: calc(100% - 1px);
      right: 0;
      min-width: 230px;
      padding: 8px;
      background: #fff;
      border: 1px solid #e1e7ef;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 8px 22px rgba(24, 49, 79, 0.16);
    }

    .site-nav.is-open {
      display: grid;
    }

    .site-nav a,
    .site-nav span {
      padding: 11px 12px;
      color: #30445d;
      text-decoration: none;
    }

    .site-nav a:hover {
      background: #edf4ff;
      color: #2857a4;
    }

    .site-nav .login-status {
      border-top: 1px solid #e7ebf0;
      color: #65758a;
      font-size: 13px;
    }

    main {
      padding: 32px 20px 56px;
    }

    @media (max-width: 600px) {
      .header-inner {
        width: calc(100% - 32px);
      }

      main {
        padding: 20px 14px 36px;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <h1><a class="app-title" href="/">防災アプリ</a></h1>
      <button class="menu-toggle" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="siteNav">☰</button>
      <nav class="site-nav" id="siteNav" aria-label="メインメニュー">
        <a href="/">ホーム</a>
        <a href="/shelter_search">避難所検索</a>
        <a href="/shelter_register">避難所登録</a>
        <a href="/board">指示・発信ボード</a>
        {% if session.logged_in %}
          <span class="login-status">ログイン中{% if session.username %}（{{ session.username }}）{% endif %}</span>
          <a href="/logout">ログアウト</a>
        {% else %}
          <span class="login-status">未ログイン</span>
          <a href="/login">ログイン</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main>
    <!-- ここに子テンプレートの content が入る -->
    {% block content %}{% endblock %}
  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const siteNav = document.querySelector('#siteNav');

    menuToggle.addEventListener('click', function() {
      const isOpen = siteNav.classList.toggle('is-open');
      menuToggle.setAttribute('aria-expanded', isOpen);
      menuToggle.setAttribute('aria-label', isOpen ? 'メニューを閉じる' : 'メニューを開く');
    });
  </script>
</body>
</html>
